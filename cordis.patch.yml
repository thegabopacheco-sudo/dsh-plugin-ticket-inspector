# dsh-plugin-ticket-inspector — capa bundle de DSH.
# Inserta una fila @deepseek-ai/dsh-mcp-client que lanza el servidor como "tickets".
# Tools resultantes: mcp__tickets__* (ver README).
- insert:
    - id: mcp-ticket-inspector
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: tickets
        transport: stdio
        command: !!js process.execPath
        args:
          - !!js "(process.env.DSH_HOME && process.env.DSH_HOME.trim() !== '' ? process.env.DSH_HOME : (process.env.USERPROFILE || process.env.HOME || '') + '/.dsh') + '/plugins/ticket-inspector/server.mjs'"
        env:
          ELECTRON_RUN_AS_NODE: '1'
        failOnStartupError: false
        toolCallTimeoutMs: 60000
